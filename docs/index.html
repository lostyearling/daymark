<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1ea">
  <title>Daymark · 日程</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260831">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="."><span class="brand-mark">D</span><span>DAYMARK</span></a>
      <div class="topbar-actions">
        <span class="sync-status" id="syncStatus"><i></i> 未连接</span>
        <button class="icon-button" id="settingsButton" type="button" aria-label="设置">⚙</button>
      </div>
    </header>

    <main>
      <section class="view-calendar" id="calendarView">
        <div class="month-nav">
          <button class="today-button" id="backToday" type="button" hidden>今天</button>
          <button class="month-arrow" id="prevMonth" type="button" aria-label="上月">←</button>
          <h1 id="monthTitle"></h1>
          <button class="month-arrow" id="nextMonth" type="button" aria-label="下月">→</button>
        </div>
        <div class="weekdays">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </section>

      <section class="view-day" id="dayView" hidden>
        <div class="day-head">
          <button class="back-button" id="backButton" type="button" aria-label="返回日历">←</button>
          <div>
            <h1 id="dayTitle"></h1>
            <p id="dayProgress"></p>
          </div>
        </div>
        <div id="dailySection"></div>
        <div id="dayList" class="task-list"></div>
        <div class="empty-state" id="emptyState" hidden><p>这一天没有其他任务</p></div>
        <form class="add-form" id="taskForm">
          <input id="taskTitle" name="title" required maxlength="120" placeholder="添加任务…">
          <textarea id="taskBody" name="body" rows="2" maxlength="2000" placeholder="详情（可选）"></textarea>
          <button type="submit">添加</button>
        </form>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="settingsModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <button class="modal-close" id="closeSettings" type="button" aria-label="关闭">×</button>
      <p class="eyebrow">连接</p><h2 id="settingsTitle">连接 GitHub</h2>
      <p class="modal-intro">任务保存在 GitHub Issues，Token 仅存于本地浏览器。</p>
      <form id="settingsForm">
        <label>用户名 / 组织<input id="ownerInput" required autocomplete="off" placeholder="例如 octocat"></label>
        <label>仓库名<input id="repoInput" required autocomplete="off" placeholder="例如 daymark"></label>
        <label>Personal Access Token<input id="tokenInput" type="password" required autocomplete="new-password" placeholder="粘贴 ghp_… 或 github_pat_…"></label>
        <div class="token-help">建议使用细粒度 Token，仅授予 Issues 读写权限。<a href="https://github.com/settings/personal-access-tokens" target="_blank" rel="noreferrer">创建 Token ↗</a></div>
        <button class="primary-button" type="submit"><span>保存并连接</span><b>→</b></button>
      </form>
      <button class="danger-link" id="clearSettings" type="button">清除本地凭据</button>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=20260831b"></script>
</body>
</html>
